; ESP32-C3 Super Mini + 1.28" round GC9A01 (240×240)
; Board in Arduino IDE: "ESP32C3 Dev Module" or "MakerGO ESP32 C3 SuperMini"

[env:supermini]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions/plane_radar.csv
extra_scripts =
  pre:scripts/firmware_version.py
  post:scripts/merge_firmware.py

; Anti-aliased VLW font (Noto Sans Bold 15, from TFT_eSPI smooth-font examples)
board_build.embed_files = data/ui_font.vlw

; USB serial over USB-C (Super Mini native USB)
; The Arduino-ESP32 platform puts -std=gnu++11 on every C++ compile line, AFTER
; build_flags, so a bare "-std=gnu++17" in build_flags is silently overridden:
; unflag the platform's standard so the one below is the one in effect.
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DWM_NODEBUG
  -DWM_MDNS

; Warnings for this project's own code only (not the libraries'): the project
; builds without any, and CI fails if one appears.
build_src_flags =
  -Wall
  -Wextra
  -Wshadow
  -Wundef
  -Wformat=2
  -Wnull-dereference

; Tilde ranges: patch releases only. These are the versions the firmware was
; tested with (LovyanGFX 1.2.29, WiFiManager 2.0.17, ArduinoJson 7.4.3); a new
; minor release can change behaviour, so moving to one is a deliberate step.
lib_deps =
  lovyan03/LovyanGFX@~1.2.7
  tzapu/WiFiManager@~2.0.17
  bblanchon/ArduinoJson@~7.4.2
